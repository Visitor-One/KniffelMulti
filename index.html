<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Kniffel Multiplayer</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#0b1020;--card:#141b2d;--card2:#1b2440;--txt:#f6f7fb;--muted:#aab2c8;--accent:#4fd1c5;--good:#5ee082;--bad:#ff6b6b;--line:#2b3658}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:linear-gradient(180deg,#0b1020,#11182a);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100%}
    body{padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
    .wrap{max-width:900px;margin:auto}
    h1{font-size:28px;margin:12px 0 4px}.version{color:var(--muted);font-size:12px;margin-bottom:14px}
    .card{background:rgba(20,27,45,.96);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 12px 30px #0004}
    input,button{font:inherit}
    input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0e1527;color:var(--txt);font-size:17px;margin:6px 0}
    button{border:0;border-radius:13px;padding:13px 16px;background:var(--accent);color:#071116;font-weight:800;cursor:pointer}
    button.secondary{background:#273454;color:var(--txt)} button.danger{background:#7d2b35;color:#fff}
    button:disabled{opacity:.45}
    .row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
    .hidden{display:none!important}
    .roomCode{font-size:34px;letter-spacing:5px;font-weight:900;text-align:center;margin:8px}
    .players{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:8px 12px;border-radius:999px;background:#202b49}.me{outline:2px solid var(--accent)}
    .turn{font-size:18px;font-weight:800;text-align:center;margin:10px 0}
    .dice{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}
    .die{width:68px;height:68px;border-radius:14px;background:#f7f7f7;color:#111;display:grid;place-items:center;font-size:38px;font-weight:900;box-shadow:inset 0 -7px 0 #d5d5d5,0 8px 18px #0005;user-select:none}
    .die.held{outline:5px solid var(--accent);transform:translateY(-4px)}
    .die.roll{animation:roll .35s linear infinite}@keyframes roll{0%{transform:rotate(0) scale(.95)}50%{transform:rotate(12deg) scale(1.05)}100%{transform:rotate(0) scale(.95)}}
    .status{text-align:center;color:var(--muted);margin:8px}
    table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:center}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
    td.option{cursor:pointer;background:#172746;color:#bfe7ff;font-weight:800}.total{font-weight:900}
    .scroll{overflow:auto;border-radius:12px}
    .small{font-size:12px;color:var(--muted)}
    .banner{padding:10px 12px;border-radius:12px;background:#17322a;color:#c9ffdb;margin:10px 0}
  </style>
</head>
<body>
<div class="wrap">
  <h1>🎲 Kniffel Multiplayer</h1>
  <div class="version">Version MP 1.0 · Supabase Realtime</div>

  <section id="loginCard" class="card">
    <input id="nameInput" maxlength="18" placeholder="Dein Name" autocomplete="nickname">
    <div class="row">
      <button id="createBtn">Spiel erstellen</button>
      <button id="showJoinBtn" class="secondary">Beitreten</button>
    </div>
    <div id="joinArea" class="hidden">
      <input id="codeInput" maxlength="6" placeholder="Raumcode" autocapitalize="characters">
      <button id="joinBtn">Raum beitreten</button>
    </div>
    <div id="authMsg" class="status"></div>
  </section>

  <section id="lobbyCard" class="card hidden">
    <div class="small">Raumcode</div>
    <div id="roomCode" class="roomCode">------</div>
    <div class="row">
      <button id="copyBtn" class="secondary">Einladungslink kopieren</button>
      <button id="startBtn">Spiel starten</button>
    </div>
    <h3>Spieler</h3>
    <div id="players" class="players"></div>
    <div id="lobbyMsg" class="status">Warte auf Spieler …</div>
  </section>

  <section id="gameCard" class="card hidden">
    <div id="turnText" class="turn"></div>
    <div id="dice" class="dice"></div>
    <div class="row">
      <button id="rollBtn">Würfeln</button>
      <button id="leaveBtn" class="danger">Spiel verlassen</button>
    </div>
    <div id="rollInfo" class="status"></div>
    <div class="scroll"><table id="scoreTable"></table></div>
  </section>

  <section id="endCard" class="card hidden">
    <h2>🏁 Spiel beendet</h2>
    <div id="winner" class="banner"></div>
    <div class="scroll"><table id="finalTable"></table></div>
    <button onclick="location.href=location.pathname">Zurück zum Start</button>
  </section>
</div>

<script>
const SUPABASE_URL = 'https://ymfeptuwlsbfwduhutom.supabase.co';
const SUPABASE_KEY = 'sb_publishable_T5JPOle-cjxiIfftUaJu1w_khtAAaMF';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CATS = [
 ['ones','Einser'],['twos','Zweier'],['threes','Dreier'],['fours','Vierer'],['fives','Fünfer'],['sixes','Sechser'],
 ['threeKind','Dreierpasch'],['fourKind','Viererpasch'],['fullHouse','Full House'],['smallStraight','Kleine Straße'],['largeStraight','Große Straße'],['kniffel','Kniffel'],['chance','Chance']
];
let me=null, room=null, players=[], channel=null, rolling=false;

const $=id=>document.getElementById(id);
const show=id=>$(id).classList.remove('hidden'), hide=id=>$(id).classList.add('hidden');

async function ensureAuth(){
  let {data:{session}}=await sb.auth.getSession();
  if(!session){
    const {data,error}=await sb.auth.signInAnonymously();
    if(error) throw error;
    session=data.session;
  }
  me=session.user;
}

function cleanName(){ return $('nameInput').value.trim().slice(0,18); }
function randomCode(){ const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; return Array.from({length:6},()=>chars[Math.floor(Math.random()*chars.length)]).join(''); }
function initialState(){
 return {turn:0,rolls:0,dice:[1,1,1,1,1],held:[false,false,false,false,false],scores:{},finished:false};
}
async function createRoom(){
 try{
  const name=cleanName(); if(!name) return $('authMsg').textContent='Bitte Namen eingeben.';
  await ensureAuth();
  const code=randomCode();
  const {data,error}=await sb.rpc('create_kniffel_room',{p_code:code,p_name:name,p_state:initialState()});
  if(error) throw error;
  await loadRoom(data);
 }catch(e){ $('authMsg').textContent='Fehler: '+e.message; }
}
async function joinRoom(){
 try{
  const name=cleanName(); const code=$('codeInput').value.trim().toUpperCase();
  if(!name||code.length<4) return $('authMsg').textContent='Name und Raumcode eingeben.';
  await ensureAuth();
  const {data,error}=await sb.rpc('join_kniffel_room',{p_code:code,p_name:name});
  if(error) throw error;
  await loadRoom(data);
 }catch(e){ $('authMsg').textContent='Beitreten fehlgeschlagen: '+e.message; }
}
async function loadRoom(roomId){
 const {data,error}=await sb.from('kniffel_rooms').select('*').eq('id',roomId).single();
 if(error) throw error;
 room=data;
 await refreshPlayers();
 subscribe();
 render();
}
async function refreshPlayers(){
 const {data}=await sb.from('kniffel_players').select('*').eq('room_id',room.id).order('seat');
 players=data||[];
}
function subscribe(){
 if(channel) sb.removeChannel(channel);
 channel=sb.channel('kniffel-'+room.id)
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'kniffel_rooms',filter:'id=eq.'+room.id},async p=>{room=p.new; await refreshPlayers(); render();})
  .on('postgres_changes',{event:'*',schema:'public',table:'kniffel_players',filter:'room_id=eq.'+room.id},async()=>{await refreshPlayers();render();})
  .subscribe();
}
async function patchState(state,status=room.status){
 const {data,error}=await sb.rpc('update_kniffel_room',{p_room:room.id,p_state:state,p_status:status});
 if(error) alert(error.message);
}
function render(){
 hide('loginCard'); $('roomCode').textContent=room.code;
 $('players').innerHTML=players.map(p=>`<span class="pill ${p.user_id===me.id?'me':''}">${esc(p.name)}${p.user_id===room.host_id?' 👑':''}</span>`).join('');
 if(room.status==='lobby'){
   show('lobbyCard'); hide('gameCard'); hide('endCard');
   $('startBtn').style.display = room.host_id===me.id ? '' : 'none';
   $('lobbyMsg').textContent = players.length<2 ? 'Mindestens 2 Spieler empfohlen.' : players.length+' Spieler bereit.';
   return;
 }
 hide('lobbyCard');
 if(room.status==='finished'||room.state.finished){ showEnd(); return; }
 show('gameCard'); hide('endCard'); renderGame();
}
function renderGame(){
 const st=room.state; const active=players[st.turn]; const myTurn=active?.user_id===me.id;
 $('turnText').textContent=active ? `Am Zug: ${active.name}${myTurn?' (du)':''}` : 'Spiel läuft';
 $('dice').innerHTML=st.dice.map((d,i)=>`<div class="die ${st.held[i]?'held':''}" data-i="${i}">${d}</div>`).join('');
 document.querySelectorAll('.die').forEach(el=>el.onclick=()=>toggleHold(+el.dataset.i));
 $('rollBtn').disabled=!myTurn||st.rolls>=3||rolling;
 $('rollBtn').textContent=st.rolls===0?'Würfeln':`Weiterwürfeln (${3-st.rolls} übrig)`;
 $('rollInfo').textContent=myTurn ? (st.rolls? 'Würfel antippen zum Halten. Danach Ergebnis eintragen.':'Du bist dran.') : 'Warte auf den anderen Spieler …';
 renderScores();
}
function toggleHold(i){
 const st=structuredClone(room.state); const active=players[st.turn];
 if(!active||active.user_id!==me.id||st.rolls===0) return;
 st.held[i]=!st.held[i]; room.state=st; renderGame();
 // Halten ist absichtlich lokal bis zum nächsten Wurf/Eintrag.
}
async function roll(){
 const st=structuredClone(room.state), active=players[st.turn];
 if(!active||active.user_id!==me.id||st.rolls>=3||rolling) return;
 rolling=true; document.querySelectorAll('.die').forEach(d=>d.classList.add('roll'));
 await new Promise(r=>setTimeout(r,380));
 for(let i=0;i<5;i++) if(!st.held[i]) st.dice[i]=1+Math.floor(Math.random()*6);
 st.rolls++; rolling=false; await patchState(st);
}
function scoreFor(cat,d){
 const counts=[0,0,0,0,0,0,0]; d.forEach(x=>counts[x]++);
 const sum=d.reduce((a,b)=>a+b,0), uniq=[...new Set(d)].sort((a,b)=>a-b).join('');
 if(['ones','twos','threes','fours','fives','sixes'].includes(cat)){
  const n={ones:1,twos:2,threes:3,fours:4,fives:5,sixes:6}[cat]; return counts[n]*n;
 }
 if(cat==='threeKind') return Math.max(...counts)>=3?sum:0;
 if(cat==='fourKind') return Math.max(...counts)>=4?sum:0;
 if(cat==='fullHouse') return counts.includes(3)&&counts.includes(2)?25:0;
 if(cat==='smallStraight') return /1234|2345|3456/.test(uniq)?30:0;
 if(cat==='largeStraight') return uniq==='12345'||uniq==='23456'?40:0;
 if(cat==='kniffel') return Math.max(...counts)===5?50:0;
 return sum;
}
function playerScoreObj(p){ return room.state.scores[p.user_id]||{}; }
function calcTotal(sc){
 const upper=['ones','twos','threes','fours','fives','sixes'].reduce((s,k)=>s+(sc[k]??0),0);
 const bonus=upper>=63?35:0;
 const lower=['threeKind','fourKind','fullHouse','smallStraight','largeStraight','kniffel','chance'].reduce((s,k)=>s+(sc[k]??0),0);
 return {upper,bonus,total:upper+bonus+lower};
}
function renderScores(){
 const st=room.state, active=players[st.turn], myTurn=active?.user_id===me.id;
 let h='<tr><th>Kategorie</th>'+players.map(p=>`<th>${esc(p.name)}</th>`).join('')+'</tr>';
 for(const [key,label] of CATS){
  h+=`<tr><td>${label}</td>`;
  for(const p of players){
   const sc=playerScoreObj(p);
   if(sc[key]!==undefined) h+=`<td>${sc[key]}</td>`;
   else if(myTurn&&p.user_id===me.id&&st.rolls>0) h+=`<td class="option" onclick="chooseScore('${key}')">${scoreFor(key,st.dice)}</td>`;
   else h+='<td>–</td>';
  }
  h+='</tr>';
 }
 h+='<tr class="total"><td>Gesamt</td>'+players.map(p=>`<td>${calcTotal(playerScoreObj(p)).total}</td>`).join('')+'</tr>';
 $('scoreTable').innerHTML=h;
}
async function chooseScore(cat){
 const st=structuredClone(room.state), active=players[st.turn];
 if(!active||active.user_id!==me.id||st.rolls===0) return;
 st.scores[me.id] ||= {};
 if(st.scores[me.id][cat]!==undefined) return;
 st.scores[me.id][cat]=scoreFor(cat,st.dice);
 const allDone=players.every(p=>Object.keys(st.scores[p.user_id]||{}).length>=CATS.length);
 if(allDone){st.finished=true; await patchState(st,'finished'); return;}
 st.turn=(st.turn+1)%players.length;
 st.rolls=0; st.dice=[1,1,1,1,1]; st.held=[false,false,false,false,false];
 await patchState(st);
}
async function startGame(){
 if(room.host_id!==me.id) return;
 const st=initialState(); players.forEach(p=>st.scores[p.user_id]={});
 await patchState(st,'playing');
}
function showEnd(){
 hide('gameCard'); show('endCard');
 const res=players.map(p=>({p,t:calcTotal(playerScoreObj(p)).total})).sort((a,b)=>b.t-a.t);
 $('winner').textContent=`Sieger: ${res[0]?.p.name||'–'} mit ${res[0]?.t||0} Punkten`;
 let h='<tr><th>Kategorie</th>'+players.map(p=>`<th>${esc(p.name)}</th>`).join('')+'</tr>';
 for(const [key,label] of CATS) h+=`<tr><td>${label}</td>`+players.map(p=>`<td>${playerScoreObj(p)[key]??'–'}</td>`).join('')+'</tr>';
 h+='<tr class="total"><td>Gesamt</td>'+players.map(p=>`<td>${calcTotal(playerScoreObj(p)).total}</td>`).join('')+'</tr>';
 $('finalTable').innerHTML=h;
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

$('createBtn').onclick=createRoom;
$('showJoinBtn').onclick=()=>show('joinArea');
$('joinBtn').onclick=joinRoom;
$('startBtn').onclick=startGame;
$('rollBtn').onclick=roll;
$('leaveBtn').onclick=()=>location.href=location.pathname;
$('copyBtn').onclick=async()=>{
 const url=location.origin+location.pathname+'?room='+room.code;
 try{await navigator.clipboard.writeText(url); $('copyBtn').textContent='Link kopiert ✓';}catch{prompt('Link kopieren:',url)}
};
const qp=new URLSearchParams(location.search).get('room');
if(qp){ $('codeInput').value=qp.toUpperCase(); show('joinArea'); }
</script>
</body>
</html>
